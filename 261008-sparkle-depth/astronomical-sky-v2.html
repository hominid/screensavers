<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar Group</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: #020a14;
        overflow: hidden;
    }
    canvas {
        position: fixed;
        top: 0;
        left: 0;
    }
    canvas.sky {
        will-change: transform;
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const ROTATION = true;
        const MILKY_WAY = true;
        const NEBULAE = true;
        const GLOW = true;
        const LINES = true;
        const DIFFRACTION_SPIKES = true;

        const TARGET_FPS = 30;
        const FRAME_MS = 1000 / TARGET_FPS;
        const REV_MINUTES = 45;
        const ROTATION_RATE = (2 * Math.PI) / (REV_MINUTES * 60);
        const BG_PARALLAX = 1;
        const ORBIT_SPEED = 1;
        const CAMERA_DIST = 2700;
        const PITCH = 0.25;
        const HFOV = Math.PI / 3;
        const GROUP_RX = 1300;
        const GROUP_RY = 420;
        const CLUSTER_MIN = 11;
        const CLUSTER_MAX = 17;
        const LOOSE_STARS = 260;
        const LINK_DIST = 190;
        const LINK_DIST_SQ = LINK_DIST * LINK_DIST;
        const LINE_RGB = '175, 190, 225';
        const LINE_ALPHA = 0.16;
        const STAR_ALPHA = 0.85;
        const GLOW_SCALE = 0.25;
        const GLOW_RADIUS = 170;
        const GLOW_BLOB_ALPHA = 0.07;
        const GLOW_STRENGTH = 0.24;
        const NEBULA_ALPHA = 0.5;
        const MW_SCALE = 0.25;
        const MW_STRENGTH = 0.16;
        const SKY_VMAX = 0.45;
        const BAND_WIDTH = 0.42;
        const BAND_AMP = 0.2;
        const FIELD_DENSITY = 1 / 2600;
        const BG_MARGIN = 160;
        const BG_REDRAW_MS = 1000;

        const STAR_TYPES = [
            { rgb: [155, 176, 255], young: 0.14, old: 0.00, field: 0.05, brightness: 1.2 },
            { rgb: [170, 191, 255], young: 0.20, old: 0.03, field: 0.10, brightness: 1.1 },
            { rgb: [202, 215, 255], young: 0.22, old: 0.10, field: 0.20, brightness: 1.05 },
            { rgb: [248, 247, 255], young: 0.18, old: 0.20, field: 0.22, brightness: 1 },
            { rgb: [255, 244, 234], young: 0.12, old: 0.25, field: 0.18, brightness: 0.95 },
            { rgb: [255, 210, 161], young: 0.10, old: 0.30, field: 0.17, brightness: 0.9 },
            { rgb: [255, 204, 111], young: 0.04, old: 0.12, field: 0.08, brightness: 0.85 }
        ];

        const bgCanvas = document.createElement('canvas');
        bgCanvas.className = 'sky';
        const bctx = bgCanvas.getContext('2d');
        document.body.appendChild(bgCanvas);
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        document.body.appendChild(canvas);
        const glowCanvas = document.createElement('canvas');
        const gctx = glowCanvas.getContext('2d');

        const cosP = Math.cos(PITCH);
        const sinP = Math.sin(PITCH);
        const angle0 = Math.random() * Math.PI * 2;
        const bandPhase = Math.random() * Math.PI * 2;
        const laneFreq = 3 + Math.floor(Math.random() * 3);
        const lanePhase = Math.random() * Math.PI * 2;

        let W = 0;
        let H = 0;
        let cx = 0;
        let cy = 0;
        let f = 1;
        let Wfull = 1;
        let clusters = [];
        let loose = [];
        let sky = [];
        let mwCanvas = null;
        let bgDrawnAt = 0;

        function gauss() {
            return Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
        }

        function pickType(key) {
            let r = Math.random();
            for (const t of STAR_TYPES) {
                if ((r -= t[key]) <= 0) return t;
            }
            return STAR_TYPES[3];
        }

        function randomUnit() {
            const z = Math.random() * 2 - 1;
            const t = Math.random() * Math.PI * 2;
            const s = Math.sqrt(1 - z * z);
            return [s * Math.cos(t), s * Math.sin(t), z];
        }

        function cross(a, b) {
            return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
        }

        function normalize(v) {
            const l = Math.hypot(v[0], v[1], v[2]);
            return [v[0] / l, v[1] / l, v[2] / l];
        }

        function orbitBasis() {
            const n = randomUnit();
            const ref = Math.abs(n[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0];
            const u = normalize(cross(n, ref));
            return [u, cross(n, u)];
        }

        function inEllipsoid(rx, ry) {
            let x;
            let y;
            let z;
            do {
                x = Math.random() * 2 - 1;
                y = Math.random() * 2 - 1;
                z = Math.random() * 2 - 1;
            } while (x * x + y * y + z * z > 1);
            return [x * rx, y * ry, z * rx];
        }

        function blobSprite(rgb, size, stops) {
            const s = document.createElement('canvas');
            s.width = s.height = size;
            const g = s.getContext('2d');
            const h = size / 2;
            const grad = g.createRadialGradient(h, h, 0, h, h, h);
            const c = rgb.join(', ');
            stops.forEach(([o, a]) => grad.addColorStop(o, `rgba(${c}, ${a})`));
            g.fillStyle = grad;
            g.fillRect(0, 0, size, size);
            return s;
        }

        const SOFT = [[0, 1], [0.2, 0.75], [0.4, 0.4], [0.6, 0.15], [0.8, 0.04], [1, 0]];

        function makeStarSprite(rgb) {
            const s = document.createElement('canvas');
            s.width = s.height = 32;
            const g = s.getContext('2d');
            const grad = g.createRadialGradient(16, 16, 0, 16, 16, 16);
            const c = rgb.join(', ');
            const core = rgb.map(v => Math.round(v + (255 - v) * 0.55)).join(', ');
            grad.addColorStop(0, `rgba(${core}, 1)`);
            grad.addColorStop(0.25, `rgba(${c}, 1)`);
            grad.addColorStop(0.45, `rgba(${c}, 0.35)`);
            grad.addColorStop(0.7, `rgba(${c}, 0.08)`);
            grad.addColorStop(1, `rgba(${c}, 0)`);
            g.fillStyle = grad;
            g.fillRect(0, 0, 32, 32);
            return s;
        }

        function makeSpikeSprite(rgb, star) {
            const s = document.createElement('canvas');
            s.width = s.height = 96;
            const g = s.getContext('2d');
            const c = rgb.join(', ');
            for (const [x0, y0, x1, y1] of [[0, 48, 96, 48], [48, 0, 48, 96]]) {
                const grad = g.createLinearGradient(x0, y0, x1, y1);
                grad.addColorStop(0, `rgba(${c}, 0)`);
                grad.addColorStop(0.5, `rgba(${c}, 0.55)`);
                grad.addColorStop(1, `rgba(${c}, 0)`);
                g.strokeStyle = grad;
                g.lineWidth = 1;
                g.beginPath();
                g.moveTo(x0, y0);
                g.lineTo(x1, y1);
                g.stroke();
            }
            g.drawImage(star, 48 - 16.5, 48 - 16.5, 33, 33);
            return s;
        }

        for (const t of STAR_TYPES) {
            t.css = `rgb(${t.rgb.join(', ')})`;
            t.star = makeStarSprite(t.rgb);
            t.spike = makeSpikeSprite(t.rgb, t.star);
            t.glow = blobSprite(t.rgb, 64, SOFT);
        }

        const HALPHA = blobSprite([205, 85, 110], 64, SOFT);
        const REFLECT = blobSprite([120, 150, 230], 64, SOFT);
        const DUST = blobSprite([0, 0, 0], 64, SOFT);
        const MW_WARM = blobSprite([210, 202, 188], 64, SOFT);
        const MW_COOL = blobSprite([185, 198, 222], 64, SOFT);

        function makeNebula(radius) {
            const size = Math.ceil(radius * 2.6 * GLOW_SCALE);
            const s = document.createElement('canvas');
            s.width = s.height = size;
            const g = s.getContext('2d');
            g.globalCompositeOperation = 'lighter';
            const n = 8 + Math.floor(Math.random() * 8);
            for (let i = 0; i < n; i++) {
                const r = size * (0.12 + Math.random() * 0.23);
                const x = size / 2 + gauss() * size * 0.16;
                const y = size / 2 + gauss() * size * 0.16;
                g.globalAlpha = 0.25 + Math.random() * 0.25;
                g.drawImage(Math.random() < 0.75 ? HALPHA : REFLECT, x - r, y - r, r * 2, r * 2);
            }
            g.globalCompositeOperation = 'destination-out';
            for (let i = 0; i < 5; i++) {
                const r = size * (0.06 + Math.random() * 0.1);
                const x = size / 2 + gauss() * size * 0.18;
                const y = size / 2 + gauss() * size * 0.18;
                g.globalAlpha = 0.5;
                g.drawImage(DUST, x - r, y - r, r * 2, r * 2);
            }
            return s;
        }

        function makeCluster(wx, wy, wz) {
            const young = Math.random() < 0.45;
            const radius = 150 + Math.random() * 180;
            const cluster = {
                wx, wy, wz, radius,
                nebula: NEBULAE && young && Math.random() < 0.4 ? makeNebula(radius) : null,
                stars: [],
                sx: 0, sy: 0, zc: 1, k: 1, fade: 1,
                visible: false
            };
            const count = 8 + Math.floor(Math.random() * 45);
            for (let i = 0; i < count; i++) {
                const [u, v] = orbitBasis();
                const a = radius * Math.cbrt(Math.random());
                const raw = 0.5 + Math.pow(Math.random(), 3) * 2.8;
                cluster.stars.push({
                    a,
                    b: a * (0.3 + 0.7 * Math.random()),
                    u, v,
                    omega: (2 * Math.PI / (420 + Math.random() * 600)) * ORBIT_SPEED,
                    phase: Math.random() * Math.PI * 2,
                    raw,
                    spiked: DIFFRACTION_SPIKES && raw > 2.9,
                    type: pickType(young ? 'young' : 'old'),
                    wx: 0, wy: 0, wz: 0,
                    sx: 0, sy: 0, k: 1, fade: 1
                });
            }
            return cluster;
        }

        function buildGroup() {
            clusters = [];
            const n = CLUSTER_MIN + Math.floor(Math.random() * (CLUSTER_MAX - CLUSTER_MIN + 1));
            let tries = 0;
            while (clusters.length < n && tries < 2000) {
                tries++;
                const [x, y, z] = inEllipsoid(GROUP_RX, GROUP_RY);
                if (clusters.some(c => Math.hypot(c.wx - x, c.wy - y, c.wz - z) < 380)) continue;
                clusters.push(makeCluster(x, y, z));
            }
            const mx = clusters.reduce((s, c) => s + c.wx, 0) / clusters.length;
            const my = clusters.reduce((s, c) => s + c.wy, 0) / clusters.length;
            const mz = clusters.reduce((s, c) => s + c.wz, 0) / clusters.length;
            for (const c of clusters) {
                c.wx -= mx;
                c.wy -= my;
                c.wz -= mz;
            }
            loose = [];
            for (let i = 0; i < LOOSE_STARS; i++) {
                const [x, y, z] = inEllipsoid(GROUP_RX * 1.15, GROUP_RY * 1.4);
                loose.push({
                    wx: x, wy: y, wz: z,
                    raw: 0.4 + Math.pow(Math.random(), 4) * 1.6,
                    type: pickType('field'),
                    sx: 0, sy: 0, k: 1, fade: 1
                });
            }
        }

        function bandCenter(theta) {
            return BAND_AMP * Math.sin(theta + bandPhase) - 0.03;
        }

        function makeMilkyWay() {
            const s = f * MW_SCALE;
            const w = Math.ceil(Wfull * MW_SCALE);
            const h = Math.ceil(2 * SKY_VMAX * s);
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            const g = c.getContext('2d');
            const yOf = (theta, dv) => (SKY_VMAX - (bandCenter(theta) + dv)) * s;
            const put = (img, x, y, r) => {
                for (const off of [-w, 0, w]) g.drawImage(img, x + off - r, y - r, r * 2, r * 2);
            };
            g.globalCompositeOperation = 'lighter';
            const n = Math.round((w * BAND_WIDTH * s) / 40);
            for (let i = 0; i < n; i++) {
                const x = Math.random() * w;
                g.globalAlpha = 0.02 + Math.random() * 0.04;
                put(Math.random() < 0.7 ? MW_WARM : MW_COOL, x, yOf(x / s, gauss() * BAND_WIDTH * 0.17), 6 + Math.random() * 22);
            }
            for (let i = 0; i < w / 60; i++) {
                const x = Math.random() * w;
                g.globalAlpha = 0.08 + Math.random() * 0.08;
                put(MW_WARM, x, yOf(x / s, gauss() * BAND_WIDTH * 0.1), 30 + Math.random() * 30);
            }
            g.globalCompositeOperation = 'destination-out';
            for (let i = 0; i < w * 0.7; i++) {
                const x = Math.random() * w;
                const theta = x / s;
                const dv = BAND_WIDTH * (0.04 + Math.sin(theta * laneFreq + lanePhase) * 0.08) + gauss() * BAND_WIDTH * 0.035;
                g.globalAlpha = 0.18 + Math.random() * 0.2;
                put(DUST, x, yOf(theta, dv), 3 + Math.random() * 11);
            }
            return c;
        }

        function buildSky() {
            Wfull = 2 * Math.PI * f;
            sky = [];
            const n = Math.round(Wfull * 2 * SKY_VMAX * f * FIELD_DENSITY);
            const nBand = MILKY_WAY ? Math.round(n * 0.6) : 0;
            for (let i = 0; i < n + nBand; i++) {
                const theta = Math.random() * Math.PI * 2;
                sky.push({
                    theta,
                    v: i < n ? (Math.random() * 2 - 1) * SKY_VMAX : bandCenter(theta) + gauss() * BAND_WIDTH * 0.2,
                    r: 0.3 + Math.pow(Math.random(), 4) * 1.1,
                    a: 0.08 + Math.pow(Math.random(), 3) * 0.5,
                    type: pickType('field')
                });
            }
            mwCanvas = MILKY_WAY ? makeMilkyWay() : null;
        }

        function drawSky(bgA) {
            const bw = bgCanvas.width;
            bctx.globalAlpha = 1;
            bctx.clearRect(0, 0, bw, H);
            const ox = cx + BG_MARGIN;
            const shift = (((bgA * f) % Wfull) + Wfull) % Wfull;
            if (mwCanvas) {
                bctx.globalAlpha = MW_STRENGTH;
                const top = cy - SKY_VMAX * f;
                const x0 = ox + shift - Wfull;
                for (const k of [-1, 0, 1]) {
                    bctx.drawImage(mwCanvas, x0 + k * Wfull, top, Wfull, 2 * SKY_VMAX * f);
                }
            }
            const half = Wfull / 2;
            for (const s of sky) {
                let dx = ((s.theta + bgA) * f) % Wfull;
                if (dx < 0) dx += Wfull;
                if (dx > half) dx -= Wfull;
                const x = ox + dx;
                const y = cy - s.v * f;
                if (x < -2 || x > bw + 2 || y < -2 || y > H + 2) continue;
                bctx.globalAlpha = s.a;
                bctx.fillStyle = s.type.css;
                bctx.beginPath();
                bctx.arc(x, y, s.r, 0, Math.PI * 2);
                bctx.fill();
            }
            bctx.globalAlpha = 1;
        }

        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;
            cx = W / 2;
            cy = H / 2;
            f = Math.max(W, H * 1.5) / 2 / Math.tan(HFOV / 2);
            canvas.width = W;
            canvas.height = H;
            bgCanvas.width = W + 2 * BG_MARGIN;
            bgCanvas.height = H;
            glowCanvas.width = Math.ceil(W * GLOW_SCALE);
            glowCanvas.height = Math.ceil(H * GLOW_SCALE);
            buildSky();
            lastBg = -Infinity;
        }

        const NEAR_Z = CAMERA_DIST - GROUP_RX;
        const DEPTH_SPAN = 2 * GROUP_RX;

        function project(p, cosA, sinA) {
            const x1 = p.wx * cosA + p.wz * sinA;
            const z1 = -p.wx * sinA + p.wz * cosA;
            const y2 = p.wy * cosP - z1 * sinP;
            const zc = p.wy * sinP + z1 * cosP + CAMERA_DIST;
            p.sx = cx + (f * x1) / zc;
            p.sy = cy + (f * y2) / zc;
            p.zc = zc;
            p.k = CAMERA_DIST / zc;
            const t = Math.min(1, Math.max(0, (zc - NEAR_Z) / DEPTH_SPAN));
            p.fade = 1.1 - 0.7 * t;
        }

        function position(t, A) {
            const cosA = Math.cos(A);
            const sinA = Math.sin(A);
            for (const s of loose) project(s, cosA, sinA);
            for (const c of clusters) {
                project(c, cosA, sinA);
                const m = ((c.radius + GLOW_RADIUS) * f) / c.zc;
                c.visible = c.zc > 50 && c.sx > -m && c.sy > -m && c.sx < W + m && c.sy < H + m;
                if (!c.visible) continue;
                for (const s of c.stars) {
                    const e = s.omega * t + s.phase;
                    const ca = s.a * Math.cos(e);
                    const sb = s.b * Math.sin(e);
                    s.wx = c.wx + ca * s.u[0] + sb * s.v[0];
                    s.wy = c.wy + ca * s.u[1] + sb * s.v[1];
                    s.wz = c.wz + ca * s.u[2] + sb * s.v[2];
                    project(s, cosA, sinA);
                }
            }
            clusters.sort((a, b) => b.zc - a.zc);
        }

        function drawGlow() {
            gctx.setTransform(1, 0, 0, 1, 0, 0);
            gctx.globalCompositeOperation = 'source-over';
            gctx.globalAlpha = 1;
            gctx.clearRect(0, 0, glowCanvas.width, glowCanvas.height);
            gctx.globalCompositeOperation = 'lighter';
            gctx.setTransform(GLOW_SCALE, 0, 0, GLOW_SCALE, 0, 0);
            for (const c of clusters) {
                if (!c.visible) continue;
                if (c.nebula) {
                    const size = (c.radius * 2.6 * f) / c.zc;
                    gctx.globalAlpha = Math.min(1, NEBULA_ALPHA * c.fade);
                    gctx.drawImage(c.nebula, c.sx - size / 2, c.sy - size / 2, size, size);
                }
                const r = (GLOW_RADIUS * f) / c.zc;
                for (const s of c.stars) {
                    gctx.globalAlpha = Math.min(1, GLOW_BLOB_ALPHA * s.fade * s.type.brightness * (0.5 + s.raw / 3));
                    gctx.drawImage(s.type.glow, s.sx - r, s.sy - r, r * 2, r * 2);
                }
            }
            gctx.setTransform(1, 0, 0, 1, 0, 0);
            gctx.globalAlpha = 1;
            ctx.globalAlpha = GLOW_STRENGTH;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(glowCanvas, 0, 0, W, H);
            ctx.globalAlpha = 1;
        }

        function drawStar(s) {
            ctx.globalAlpha = Math.min(1, STAR_ALPHA * s.fade * s.type.brightness);
            if (s.spiked) {
                const r = s.raw * s.k * 7;
                ctx.drawImage(s.type.spike, s.sx - r, s.sy - r, r * 2, r * 2);
            } else {
                const r = s.raw * s.k * 2.4;
                ctx.drawImage(s.type.star, s.sx - r, s.sy - r, r * 2, r * 2);
            }
        }

        function drawCluster(c) {
            const m = c.stars;
            if (LINES) {
                ctx.lineWidth = Math.max(0.4, Math.min(1.3, 0.85 * c.k));
                for (let i = 0; i < m.length; i++) {
                    const p1 = m[i];
                    for (let j = i + 1; j < m.length; j++) {
                        const p2 = m[j];
                        const dx = p1.wx - p2.wx;
                        const dy = p1.wy - p2.wy;
                        const dz = p1.wz - p2.wz;
                        const dSq = dx * dx + dy * dy + dz * dz;
                        if (dSq < LINK_DIST_SQ) {
                            const alpha = (1 - Math.sqrt(dSq) / LINK_DIST) * LINE_ALPHA * Math.min(p1.fade, p2.fade);
                            ctx.strokeStyle = `rgba(${LINE_RGB}, ${alpha})`;
                            ctx.beginPath();
                            ctx.moveTo(p1.sx, p1.sy);
                            ctx.lineTo(p2.sx, p2.sy);
                            ctx.stroke();
                        }
                    }
                }
            }
            for (const s of m) drawStar(s);
            ctx.globalAlpha = 1;
        }

        let last = -Infinity;
        let lastBg = -Infinity;

        function animate(now) {
            requestAnimationFrame(animate);
            if (now - last < FRAME_MS - 2) return;
            last = now;
            const t = now / 1000;
            const A = ROTATION ? angle0 + ROTATION_RATE * t : angle0;
            const bgA = A * BG_PARALLAX;

            if (now - lastBg >= BG_REDRAW_MS) {
                drawSky(bgA);
                bgDrawnAt = bgA;
                lastBg = now;
            }
            bgCanvas.style.transform = `translate3d(${(bgA - bgDrawnAt) * f - BG_MARGIN}px, 0, 0)`;

            position(t, A);
            ctx.clearRect(0, 0, W, H);
            if (GLOW) drawGlow();
            for (const s of loose) drawStar(s);
            ctx.globalAlpha = 1;
            for (const c of clusters) {
                if (c.visible) drawCluster(c);
            }
        }

        buildGroup();
        resize();
        window.addEventListener('resize', resize);
        requestAnimationFrame(animate);
    });
</script>
</head>
<body>
</body>
</html>
