<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expanded Wave</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: #080808;
        overflow: hidden;
    }
    canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.15;
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        document.body.appendChild(canvas);

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        resize();
        window.addEventListener('resize', resize);

        let time = 0;
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = '#ffffff';
            
            for (let x = 0; x < canvas.width; x++) {
                const heightFactor = canvas.height * 0.4;
                const y = canvas.height/2 + 
                    Math.sin(x * 0.01 + time) * heightFactor + 
                    Math.sin(x * 0.02 + time * 1.1) * (heightFactor * 0.5);
                
                if (x === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            
            ctx.stroke();
            time += 0.003;
            requestAnimationFrame(animate);
        }
        
        animate();
    });
</script>
</head>
<body>
</body>
</html>
