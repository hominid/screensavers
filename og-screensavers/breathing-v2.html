<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enhanced Breathing</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background-color: #080808;
        animation: breathe 12s ease-in-out infinite;
    }
    @keyframes breathe {
        0% { background-color: #080808; }
        25% { background-color: #151515; }
        50% { background-color: #1a1a1a; }
        75% { background-color: #121212; }
        100% { background-color: #080808; }
    }
</style>
</head>
<body>
</body>
</html>
