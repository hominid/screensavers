<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astronomical Connected Particles</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: #00101c;
        overflow: hidden;
    }
    canvas {
        position: fixed;
        top: 0;
        left: 0;
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const DEPTH = true;
        const GLOW = true;
        const STAR_FIELD = true;

        const TARGET_FPS = 30;
        const FRAME_MS = 1000 / TARGET_FPS;
        const BASE_FRAME_MS = 1000 / 60;
        const LINK_DIST = 150;
        const LINK_DIST_SQ = LINK_DIST * LINK_DIST;
        const LINE_RGB = '165, 180, 215';
        const STAR_ALPHA = 0.6;
        const GLOW_SCALE = 0.25;
        const GLOW_RADIUS = 120;
        const GLOW_BLOB_ALPHA = 0.12;
        const GLOW_STRENGTH = 0.25;
        const FIELD_DENSITY = 1 / 3500;

        const STAR_TYPES = [
            { rgb: [155, 176, 255], weight: 0.06, brightness: 1.15 },
            { rgb: [170, 191, 255], weight: 0.12, brightness: 1.1 },
            { rgb: [202, 215, 255], weight: 0.20, brightness: 1.05 },
            { rgb: [248, 247, 255], weight: 0.20, brightness: 1 },
            { rgb: [255, 244, 234], weight: 0.18, brightness: 0.95 },
            { rgb: [255, 210, 161], weight: 0.17, brightness: 0.9 },
            { rgb: [255, 204, 111], weight: 0.07, brightness: 0.85 }
        ];

        const bgCanvas = document.createElement('canvas');
        const bctx = bgCanvas.getContext('2d');
        document.body.appendChild(bgCanvas);
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        document.body.appendChild(canvas);
        const glowCanvas = document.createElement('canvas');
        const gctx = glowCanvas.getContext('2d');

        let particles = [];
        let clusters = [];
        let field = [];
        let lastW = 0;
        let lastH = 0;

        function pickStarType() {
            let r = Math.random();
            for (const t of STAR_TYPES) {
                if ((r -= t.weight) <= 0) return t;
            }
            return STAR_TYPES[STAR_TYPES.length - 1];
        }

        function makeGlowSprite(rgb) {
            const s = document.createElement('canvas');
            s.width = s.height = 64;
            const g = s.getContext('2d');
            const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
            const c = rgb.join(', ');
            [[0, 1], [0.2, 0.75], [0.4, 0.4], [0.6, 0.15], [0.8, 0.04], [1, 0]]
                .forEach(([o, a]) => grad.addColorStop(o, `rgba(${c}, ${a})`));
            g.fillStyle = grad;
            g.fillRect(0, 0, 64, 64);
            return s;
        }

        function makeStarSprite(rgb) {
            const s = document.createElement('canvas');
            s.width = s.height = 32;
            const g = s.getContext('2d');
            const grad = g.createRadialGradient(16, 16, 0, 16, 16, 16);
            const c = rgb.join(', ');
            const core = rgb.map(v => Math.round(v + (255 - v) * 0.55)).join(', ');
            grad.addColorStop(0, `rgba(${core}, 1)`);
            grad.addColorStop(0.25, `rgba(${c}, 1)`);
            grad.addColorStop(0.45, `rgba(${c}, 0.35)`);
            grad.addColorStop(0.7, `rgba(${c}, 0.08)`);
            grad.addColorStop(1, `rgba(${c}, 0)`);
            g.fillStyle = grad;
            g.fillRect(0, 0, 32, 32);
            return s;
        }

        for (const t of STAR_TYPES) {
            t.glow = makeGlowSprite(t.rgb);
            t.star = makeStarSprite(t.rgb);
            t.css = t.rgb.join(', ');
        }

        function buildField() {
            field = [];
            const n = Math.round(canvas.width * canvas.height * FIELD_DENSITY);
            for (let i = 0; i < n; i++) {
                field.push({
                    u: Math.random(),
                    v: Math.random(),
                    r: 0.35 + Math.random() * 0.55,
                    a: 0.06 + Math.pow(Math.random(), 2.5) * 0.3,
                    type: pickStarType()
                });
            }
        }

        function drawField() {
            bctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            if (!STAR_FIELD) return;
            for (const s of field) {
                bctx.fillStyle = `rgba(${s.type.css}, ${s.a})`;
                bctx.beginPath();
                bctx.arc(s.u * bgCanvas.width, s.v * bgCanvas.height, s.r, 0, Math.PI * 2);
                bctx.fill();
            }
        }

        function resize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            if (lastW && lastH && (w !== lastW || h !== lastH)) {
                for (const c of clusters) {
                    const dx = c.x * (w / lastW - 1);
                    const dy = c.y * (h / lastH - 1);
                    c.x += dx;
                    c.y += dy;
                    for (const p of c.members) {
                        p.x += dx; p.y += dy;
                        p.startX += dx; p.startY += dy;
                        p.targetX += dx; p.targetY += dy;
                    }
                }
            }
            canvas.width = bgCanvas.width = w;
            canvas.height = bgCanvas.height = h;
            glowCanvas.width = Math.ceil(w * GLOW_SCALE);
            glowCanvas.height = Math.ceil(h * GLOW_SCALE);
            lastW = w;
            lastH = h;
            drawField();
        }

        resize();
        window.addEventListener('resize', resize);

        class Particle {
            constructor(x, y, cluster) {
                this.x = x;
                this.y = y;
                this.speed = 0.0001 + Math.random() * 0.0001;
                this.cluster = cluster;
                this.type = pickStarType();
                this.size = (Math.random() * 2 + 1) * cluster.scale;
                this.setNewTarget();
            }

            setNewTarget() {
                const c = this.cluster;
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.pow(Math.random(), 0.5) * c.radius;
                this.startX = this.x;
                this.startY = this.y;
                this.targetX = c.x + Math.cos(angle) * distance;
                this.targetY = c.y + Math.sin(angle) * distance;
                this.progress = 0;
            }

            update(step) {
                this.progress += this.speed * step;
                if (this.progress >= 1) {
                    this.setNewTarget();
                }
                const t = Math.sin(this.progress * Math.PI);
                this.x = this.startX + (this.targetX - this.startX) * t;
                this.y = this.startY + (this.targetY - this.startY) * t;
            }
        }

        function createCluster(x, y, count, radius) {
            const depth = DEPTH ? Math.random() : 1;
            const cluster = {
                x, y, radius, depth,
                scale: DEPTH ? 0.55 + 0.45 * depth : 1,
                alpha: DEPTH ? 0.45 + 0.65 * depth : 1,
                lineWidth: DEPTH ? 0.6 + 0.6 * depth : 1,
                members: []
            };
            clusters.push(cluster);
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.pow(Math.random(), 0.5) * radius;
                const p = new Particle(x + Math.cos(angle) * distance, y + Math.sin(angle) * distance, cluster);
                cluster.members.push(p);
                particles.push(p);
            }
        }

        function init() {
            particles = [];
            clusters = [];
            const numClusters = Math.floor(Math.random() * 8) + 8;
            for (let i = 0; i < numClusters; i++) {
                const radius = Math.random() * 200 + 150;
                const count = Math.floor(Math.random() * 49) + 7;
                createCluster(Math.random() * canvas.width, Math.random() * canvas.height, count, radius);
            }
            clusters.sort((a, b) => a.depth - b.depth);
            buildField();
            drawField();
        }

        function drawGlow() {
            gctx.setTransform(1, 0, 0, 1, 0, 0);
            gctx.globalCompositeOperation = 'source-over';
            gctx.clearRect(0, 0, glowCanvas.width, glowCanvas.height);
            gctx.globalCompositeOperation = 'lighter';
            gctx.setTransform(GLOW_SCALE, 0, 0, GLOW_SCALE, 0, 0);
            for (const c of clusters) {
                const r = GLOW_RADIUS * c.scale;
                for (const p of c.members) {
                    gctx.globalAlpha = Math.min(1, GLOW_BLOB_ALPHA * c.alpha * p.type.brightness);
                    gctx.drawImage(p.type.glow, p.x - r, p.y - r, r * 2, r * 2);
                }
            }
            gctx.globalAlpha = 1;
            ctx.globalAlpha = GLOW_STRENGTH;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(glowCanvas, 0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1;
        }

        function drawCluster(c) {
            const m = c.members;
            const lineAlpha = 0.13 * c.alpha;
            ctx.lineWidth = c.lineWidth;
            for (let i = 0; i < m.length; i++) {
                const p1 = m[i];
                for (let j = i + 1; j < m.length; j++) {
                    const p2 = m[j];
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const dSq = dx * dx + dy * dy;
                    if (dSq < LINK_DIST_SQ) {
                        const alpha = (1 - Math.sqrt(dSq) / LINK_DIST) * lineAlpha;
                        ctx.strokeStyle = `rgba(${LINE_RGB}, ${alpha})`;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }

            for (const p of m) {
                const r = p.size * 2.4;
                ctx.globalAlpha = Math.min(1, STAR_ALPHA * c.alpha * p.type.brightness);
                ctx.drawImage(p.type.star, p.x - r, p.y - r, r * 2, r * 2);
            }
            ctx.globalAlpha = 1;
        }

        let last = performance.now();

        function animate(now) {
            requestAnimationFrame(animate);
            const elapsed = now - last;
            if (elapsed < FRAME_MS - 2) return;
            last = now;
            const step = Math.min(elapsed, 250) / BASE_FRAME_MS;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const p of particles) p.update(step);
            if (GLOW) drawGlow();
            for (const c of clusters) drawCluster(c);
        }

        init();
        requestAnimationFrame(animate);
    });
</script>
</head>
<body>
</body>
</html>
