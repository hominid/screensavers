        const ROTATION_RATE = (2 * Math.PI) / (REV_MINUTES * 60);
        const BG_PARALLAX = 1;
        const DISTANCE_EXPONENT = 0.75;
        const DISTANCE_REF = 100;
        const WORLD_SCALE = 4.6;
        const CAMERA_DIST = 3600;
        const NEAR_CLIP = 250;
        const PITCH = 0.18;
        const HFOV = Math.PI / 3;
        const LUM_MAG = 6;
        const LUM_RANGE = 12;
        const LINE_RGB = '175, 190, 225';
        const LINE_ALPHA = 0.22;
        const STAR_ALPHA = 0.9;
        const GLOW_SCALE = 0.25;
        const GLOW_RADIUS = 150;
        const GLOW_BLOB_ALPHA = 0.06;
        const GLOW_STRENGTH = 0.2;
        const MW_SCALE = 0.25;
        const MW_STRENGTH = 0.17;
        const SKY_BMAX = 0.65;
        const BAND_WIDTH = 0.36;
        const BG_MARGIN = 160;
        const BG_REDRAW_MS = 1000;

        const STAR_TYPES = [
            { rgb: [155, 176, 255], brightness: 1.15 },
            { rgb: [170, 191, 255], brightness: 1.1 },
            { rgb: [202, 215, 255], brightness: 1.05 },
            { rgb: [248, 247, 255], brightness: 1 },
            { rgb: [255, 244, 234], brightness: 0.95 },
            { rgb: [255, 210, 161], brightness: 0.9 },
            { rgb: [255, 204, 111], brightness: 0.85 }
        ];
        const CI_BREAKS = [-0.15, 0, 0.3, 0.58, 0.81, 1.4];

        function typeForCI(ci) {
            let i = 0;
            while (i < CI_BREAKS.length && ci >= CI_BREAKS[i]) i++;
            return STAR_TYPES[i];
        }

        const bgCanvas = document.createElement('canvas');
        bgCanvas.className = 'sky';
        const bctx = bgCanvas.getContext('2d');
        document.body.appendChild(bgCanvas);
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        document.body.appendChild(canvas);
        const glowCanvas = document.createElement('canvas');
        const gctx = glowCanvas.getContext('2d');

        const cosP = Math.cos(PITCH);
        const sinP = Math.sin(PITCH);
        const angle0 = Math.random() * Math.PI * 2;

        let W = 0;
        let H = 0;
        let cx = 0;
        let cy = 0;
        let f = 1;
        let Wfull = 1;
        let mwCanvas = null;
        let bgDrawnAt = 0;

        function gauss() {
            return Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
        }

        function blobSprite(rgb, size, stops) {
            const s = document.createElement('canvas');
            s.width = s.height = size;
            const g = s.getContext('2d');
            const h = size / 2;
            const grad = g.createRadialGradient(h, h, 0, h, h, h);
            const c = rgb.join(', ');
            stops.forEach(([o, a]) => grad.addColorStop(o, `rgba(${c}, ${a})`));
            g.fillStyle = grad;
            g.fillRect(0, 0, size, size);
            return s;
        }

        const SOFT = [[0, 1], [0.2, 0.75], [0.4, 0.4], [0.6, 0.15], [0.8, 0.04], [1, 0]];

        function makeStarSprite(rgb) {
            const s = document.createElement('canvas');
            s.width = s.height = 32;
            const g = s.getContext('2d');
            const grad = g.createRadialGradient(16, 16, 0, 16, 16, 16);
            const c = rgb.join(', ');
            const core = rgb.map(v => Math.round(v + (255 - v) * 0.55)).join(', ');
            grad.addColorStop(0, `rgba(${core}, 1)`);
            grad.addColorStop(0.25, `rgba(${c}, 1)`);
            grad.addColorStop(0.45, `rgba(${c}, 0.35)`);
            grad.addColorStop(0.7, `rgba(${c}, 0.08)`);
            grad.addColorStop(1, `rgba(${c}, 0)`);
            g.fillStyle = grad;
            g.fillRect(0, 0, 32, 32);
            return s;
        }

        function makeSpikeSprite(rgb, star) {
            const s = document.createElement('canvas');
            s.width = s.height = 96;
            const g = s.getContext('2d');
            const c = rgb.join(', ');
            for (const [x0, y0, x1, y1] of [[0, 48, 96, 48], [48, 0, 48, 96]]) {
                const grad = g.createLinearGradient(x0, y0, x1, y1);
                grad.addColorStop(0, `rgba(${c}, 0)`);
                grad.addColorStop(0.5, `rgba(${c}, 0.55)`);
                grad.addColorStop(1, `rgba(${c}, 0)`);
                g.strokeStyle = grad;
                g.lineWidth = 1;
                g.beginPath();
                g.moveTo(x0, y0);
                g.lineTo(x1, y1);
                g.stroke();
            }
            g.drawImage(star, 48 - 16.5, 48 - 16.5, 33, 33);
            return s;
        }

        for (const t of STAR_TYPES) {
            t.css = `rgb(${t.rgb.join(', ')})`;
            t.star = makeStarSprite(t.rgb);
            t.spike = makeSpikeSprite(t.rgb, t.star);
            t.glow = blobSprite(t.rgb, 64, SOFT);
        }

        const DUST = blobSprite([0, 0, 0], 64, SOFT);
        const MW_WARM = blobSprite([210, 202, 188], 64, SOFT);
        const MW_COOL = blobSprite([185, 198, 222], 64, SOFT);

        const stars = DATA.s.map(([gx, gy, gz, absMag, ci]) => {
            const r = Math.hypot(gx, gy, gz) || 1;
            const k = Math.pow(r / DISTANCE_REF, DISTANCE_EXPONENT - 1) * WORLD_SCALE;
            const lum = Math.min(1, Math.max(0, (LUM_MAG - absMag) / LUM_RANGE));
            return {
                wx: -gy * k,
                wy: -gz * k,
                wz: gx * k,
                lum,
                raw: 0.45 + 2.9 * Math.pow(lum, 1.8),
                light: 0.3 + 0.7 * Math.sqrt(lum),
                spiked: DIFFRACTION_SPIKES && lum > 0.85,
                type: typeForCI(ci),
                sx: 0, sy: 0, zc: 1, k: 1, fade: 1, on: false
            };
        });
        const segments = DATA.l;
        const sun = { wx: 0, wy: 0, wz: 0, sx: 0, sy: 0, zc: 1, k: 1, fade: 1 };

        const sky = DATA.b.map(([l, b, mag, ci]) => ({
            theta: -l,
            b,
            r: 0.35 + Math.min(2.5, 7 - mag) * 0.4,
            a: 0.1 + Math.min(2.5, 7 - mag) * 0.2,
            type: typeForCI(ci)
        }));

        function wrapAngle(a) {
            a %= 2 * Math.PI;
            if (a > Math.PI) a -= 2 * Math.PI;
            if (a < -Math.PI) a += 2 * Math.PI;
            return a;
        }

        function makeMilkyWay() {
            const s = f * MW_SCALE;
            const w = Math.ceil(Wfull * MW_SCALE);
            const h = Math.ceil(2 * SKY_BMAX * s);
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            const g = c.getContext('2d');
            const yOf = b => (SKY_BMAX - b) * s;
            const put = (img, x, y, r) => {
                for (const off of [-w, 0, w]) g.drawImage(img, x + off - r, y - r, r * 2, r * 2);
            };
            const coreOf = theta => Math.exp(-Math.pow(wrapAngle(-theta) / 0.6, 2));
            const bulgeOf = theta => Math.exp(-Math.pow(wrapAngle(-theta) / 0.3, 2));
            g.globalCompositeOperation = 'lighter';
            const n = Math.round((w * BAND_WIDTH * s) / 34);
            for (let i = 0; i < n; i++) {
                const x = Math.random() * w;
                const theta = x / s;
                const core = coreOf(theta);
                const width = BAND_WIDTH * (1 + 0.8 * bulgeOf(theta));
                g.globalAlpha = (0.015 + Math.random() * 0.035) * (0.55 + 0.9 * core);
                put(Math.random() < 0.6 + 0.3 * core ? MW_WARM : MW_COOL, x, yOf(gauss() * width * 0.17), 6 + Math.random() * 22);
            }
            for (let i = 0; i < w / 50; i++) {
                const x = Math.random() * w;
                const core = coreOf(x / s);
                g.globalAlpha = (0.06 + Math.random() * 0.08) * (0.5 + core);
                put(MW_WARM, x, yOf(gauss() * BAND_WIDTH * 0.1), 30 + Math.random() * 30);
            }
            g.globalCompositeOperation = 'destination-out';
            for (let i = 0; i < w * 0.5; i++) {
                const x = Math.random() * w;
                g.globalAlpha = 0.12 + Math.random() * 0.15;
                put(DUST, x, yOf(gauss() * BAND_WIDTH * 0.12), 3 + Math.random() * 9);
            }
            for (let i = 0; i < w * 0.6; i++) {
                const l = -0.45 + Math.random() * 1.95;
                const x = (((-l * s) % w) + w) % w;
                const taper = Math.sin(((l + 0.45) / 1.95) * Math.PI);
                g.globalAlpha = (0.2 + Math.random() * 0.25) * taper;
                put(DUST, x, yOf(0.035 + gauss() * BAND_WIDTH * 0.04), 3 + Math.random() * 10);
            }
            return c;
        }

        function drawSky(bgA) {
            const bw = bgCanvas.width;
            bctx.globalAlpha = 1;
            bctx.clearRect(0, 0, bw, H);
            const ox = cx + BG_MARGIN;
            const shift = (((bgA * f) % Wfull) + Wfull) % Wfull;
            if (mwCanvas) {
                bctx.globalAlpha = MW_STRENGTH;
                const top = cy - (SKY_BMAX + PITCH) * f;
                const x0 = ox + shift - Wfull;
                for (const k of [-1, 0, 1]) {
                    bctx.drawImage(mwCanvas, x0 + k * Wfull, top, Wfull, 2 * SKY_BMAX * f);
                }
            }
            const half = Wfull / 2;
            for (const s of sky) {
                let dx = ((s.theta + bgA) * f) % Wfull;
                if (dx < 0) dx += Wfull;
                if (dx > half) dx -= Wfull;
                const x = ox + dx;
                const y = cy - (s.b + PITCH) * f;
                if (x < -2 || x > bw + 2 || y < -2 || y > H + 2) continue;
                bctx.globalAlpha = s.a;
                bctx.fillStyle = s.type.css;
                bctx.beginPath();
                bctx.arc(x, y, s.r, 0, Math.PI * 2);
                bctx.fill();
            }
            bctx.globalAlpha = 1;
        }

        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;
            cx = W / 2;
            cy = H / 2;
            f = Math.max(W, H * 1.5) / 2 / Math.tan(HFOV / 2);
            Wfull = 2 * Math.PI * f;
            canvas.width = W;
            canvas.height = H;
            bgCanvas.width = W + 2 * BG_MARGIN;
            bgCanvas.height = H;
            glowCanvas.width = Math.ceil(W * GLOW_SCALE);
            glowCanvas.height = Math.ceil(H * GLOW_SCALE);
            mwCanvas = MILKY_WAY ? makeMilkyWay() : null;
            lastBg = -Infinity;
        }

        const NEAR_Z = CAMERA_DIST - 1000;
        const DEPTH_SPAN = 2200;

        function project(p, cosA, sinA) {
            const x1 = p.wx * cosA + p.wz * sinA;
            const z1 = -p.wx * sinA + p.wz * cosA;
            const y2 = p.wy * cosP - z1 * sinP;
            const zc = p.wy * sinP + z1 * cosP + CAMERA_DIST;
            p.zc = zc;
            if (zc < NEAR_CLIP) {
                p.on = false;
                return;
            }
            p.sx = cx + (f * x1) / zc;
            p.sy = cy + (f * y2) / zc;
            p.k = Math.min(2.5, CAMERA_DIST / zc);
            const t = Math.min(1, Math.max(0, (zc - NEAR_Z) / DEPTH_SPAN));
            p.fade = 1.1 - 0.7 * t;
            p.on = p.sx > -60 && p.sy > -60 && p.sx < W + 60 && p.sy < H + 60;
        }

        function drawGlow() {
            gctx.setTransform(1, 0, 0, 1, 0, 0);
            gctx.globalCompositeOperation = 'source-over';
            gctx.globalAlpha = 1;
            gctx.clearRect(0, 0, glowCanvas.width, glowCanvas.height);
            gctx.globalCompositeOperation = 'lighter';
            gctx.setTransform(GLOW_SCALE, 0, 0, GLOW_SCALE, 0, 0);
            for (const s of stars) {
                if (!s.on || s.lum < 0.55) continue;
                const r = (GLOW_RADIUS * f) / s.zc;
                gctx.globalAlpha = Math.min(1, GLOW_BLOB_ALPHA * s.fade * s.type.brightness * s.light * (0.5 + s.raw / 3));
                gctx.drawImage(s.type.glow, s.sx - r, s.sy - r, r * 2, r * 2);
            }
            gctx.setTransform(1, 0, 0, 1, 0, 0);
            gctx.globalAlpha = 1;
            ctx.globalAlpha = GLOW_STRENGTH;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(glowCanvas, 0, 0, W, H);
            ctx.globalAlpha = 1;
        }

        function drawLines() {
            ctx.lineWidth = 0.8;
            for (const [i, j] of segments) {
                const a = stars[i];
                const b = stars[j];
                if (a.zc < NEAR_CLIP || b.zc < NEAR_CLIP) continue;
                if (!a.on && !b.on && !segmentCrosses(a, b)) continue;
                ctx.strokeStyle = `rgba(${LINE_RGB}, ${LINE_ALPHA * Math.min(a.fade, b.fade)})`;
                ctx.beginPath();
                ctx.moveTo(a.sx, a.sy);
                ctx.lineTo(b.sx, b.sy);
                ctx.stroke();
            }
        }

        function segmentCrosses(a, b) {
            return !(Math.max(a.sx, b.sx) < 0 || Math.min(a.sx, b.sx) > W || Math.max(a.sy, b.sy) < 0 || Math.min(a.sy, b.sy) > H);
        }

        function drawStars() {
            for (const s of stars) {
                if (!s.on) continue;
                ctx.globalAlpha = Math.min(1, STAR_ALPHA * s.fade * s.type.brightness * s.light);
                if (s.spiked) {
                    const r = s.raw * s.k * 7;
                    ctx.drawImage(s.type.spike, s.sx - r, s.sy - r, r * 2, r * 2);
                } else {
                    const r = Math.max(0.9, s.raw * s.k * 2.4);
                    ctx.drawImage(s.type.star, s.sx - r, s.sy - r, r * 2, r * 2);
                }
            }
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            if (sun.zc < NEAR_CLIP) return;
            ctx.strokeStyle = 'rgba(255, 236, 200, 0.22)';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.arc(sun.sx, sun.sy, 7, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 0.8;
            ctx.drawImage(STAR_TYPES[4].star, sun.sx - 2.5, sun.sy - 2.5, 5, 5);
            ctx.globalAlpha = 1;
        }

        let last = -Infinity;
        let lastBg = -Infinity;

        function animate(now) {
            requestAnimationFrame(animate);
            if (now - last < FRAME_MS - 2) return;
            last = now;
            const A = ROTATION ? angle0 + (ROTATION_RATE * now) / 1000 : angle0;
            const bgA = A * BG_PARALLAX;

            if (now - lastBg >= BG_REDRAW_MS) {
                drawSky(bgA);
                bgDrawnAt = bgA;
                lastBg = now;
            }
            bgCanvas.style.transform = `translate3d(${(bgA - bgDrawnAt) * f - BG_MARGIN}px, 0, 0)`;

            const cosA = Math.cos(A);
            const sinA = Math.sin(A);
            for (const s of stars) project(s, cosA, sinA);
            project(sun, cosA, sinA);

            ctx.clearRect(0, 0, W, H);
            if (GLOW) drawGlow();
            if (CONSTELLATIONS) drawLines();
            drawStars();
            if (SUN_MARKER) drawSun();
        }

        resize();
        window.addEventListener('resize', resize);
        requestAnimationFrame(animate);
    });
</script>
</head>
<body>
</body>
</html>
