<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ethereal Constellation Bird</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: #001524;
        overflow: hidden;
    }
    canvas {
        position: fixed;
        top: 0;
        left: 0;
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        document.body.appendChild(canvas);

        let birdParticles = [];
        let globalTime = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // 3D Skeleton Nodes (Now with a volumetric head!)
        const nodes = [
            // Head & Neck
            {x: 45, y: 0, z: 0},       // 0: Beak (Tip)
            {x: 35, y: -6, z: 5},      // 1: Left Crown
            {x: 35, y: -6, z: -5},     // 2: Right Crown
            {x: 25, y: -4, z: 0},      // 3: Nape (Back of neck, center)
            {x: 30, y: 4, z: 4},       // 4: Left Throat
            {x: 30, y: 4, z: -4},      // 5: Right Throat
            
            // Central Spine
            {x: 10, y: -5, z: 0},      // 6: Upper Spine
            {x: -15, y: -2, z: 0},     // 7: Lower Spine
            
            // 3D Ribcage
            {x: 15, y: 8, z: 12},      // 8: Left Chest
            {x: 15, y: 8, z: -12},     // 9: Right Chest
            {x: -5, y: 6, z: 10},      // 10: Left Belly
            {x: -5, y: 6, z: -10},     // 11: Right Belly

            // Tail Fan
            {x: -40, y: -2, z: 0},     // 12: Tail Center
            {x: -35, y: 0, z: 15},     // 13: Tail Left
            {x: -35, y: 0, z: -15},    // 14: Tail Right

            // Left Wing (+Z)
            {x: 5, y: -2, z: 14},      // 15: L Shoulder
            {x: 0, y: -2, z: 35, flap: 15, phase: 0.1},   // 16: L Elbow
            {x: -10, y: -5, z: 65, flap: 45, phase: 0.3}, // 17: L Wrist
            {x: -25, y: -10, z: 100, flap: 80, phase: 0.6},// 18: L Primary Tip
            {x: -35, y: -5, z: 85, flap: 70, phase: 0.7}, // 19: L Secondary Tip
            {x: -30, y: 2, z: 55, flap: 35, phase: 0.4},  // 20: L Trailing Edge 1
            {x: -15, y: 4, z: 25, flap: 15, phase: 0.2},  // 21: L Trailing Edge 2

            // Right Wing (-Z)
            {x: 5, y: -2, z: -14},     // 22: R Shoulder
            {x: 0, y: -2, z: -35, flap: 15, phase: 0.1},  // 23: R Elbow
            {x: -10, y: -5, z: -65, flap: 45, phase: 0.3},// 24: R Wrist
            {x: -25, y: -10, z: -100, flap: 80, phase: 0.6},// 25: R Primary Tip
            {x: -35, y: -5, z: -85, flap: 70, phase: 0.7},// 26: R Secondary Tip
            {x: -30, y: 2, z: -55, flap: 35, phase: 0.4}, // 27: R Trailing Edge 1
            {x: -15, y: 4, z: -25, flap: 15, phase: 0.2}  // 28: R Trailing Edge 2
        ];

        // FACES: Solid panels
        const faces = [
            // Head & Neck
            [0, 1, 3, 4],       // Left Head/Neck
            [0, 2, 3, 5],       // Right Head/Neck
            [1, 2, 0],          // Top of head / Beak
            [4, 5, 0],          // Bottom of jaw
            
            // Torso
            [3, 6, 8, 4],       // Left Upper Neck/Chest
            [3, 6, 9, 5],       // Right Upper Neck/Chest
            [6, 7, 10, 8],      // Left Back/Ribs
            [6, 7, 11, 9],      // Right Back/Ribs
            [4, 8, 10, 12, 11, 9, 5], // Underbelly
            
            // Tail
            [7, 13, 12],        // Left Tail Fan
            [7, 12, 14],        // Right Tail Fan

            // Left Wing Panels
            [15, 16, 21],       // Inner Wing
            [16, 17, 20, 21],   // Mid Wing
            [17, 18, 19, 20],   // Outer WingTip
            
            // Right Wing Panels
            [22, 23, 28],       // Inner Wing
            [23, 24, 27, 28],   // Mid Wing
            [24, 25, 26, 27]    // Outer WingTip
        ];

        function getFlightPath(t) {
            let cx = canvas.width / 2;
            let cy = canvas.height / 2;
            
            let maxRadiusX = Math.min(canvas.width * 0.4, 350); 
            let maxRadiusY = Math.min(canvas.height * 0.3, 150);
            
            let x = Math.sin(t * 0.35) * maxRadiusX; 
            let y = Math.sin(t * 0.6) * maxRadiusY + Math.cos(t * 0.2) * 50;
            let z = Math.cos(t * 0.45) * 300 - 200; 
            
            return { x: cx + x, y: cy + y, z: z };
        }

        class NodeParticle {
            constructor(index) {
                this.index = index;
                this.size = Math.random() * 0.6 + 0.6; // Even smaller base size
                this.color = '180, 220, 255'; 
                // Organic variables for twinkling
                this.twinkleSpeed = Math.random() * 0.05 + 0.02;
                this.twinklePhase = Math.random() * Math.PI * 2;
            }

            update(worldPos, yaw, pitch, bank, t) {
                let base = nodes[this.index];
                let flapY = 0, flapX = 0, flapZ = 0;
                
                if (base.flap) {
                    let flapSpeed = 5; 
                    let flapVal = Math.sin(t * flapSpeed - base.phase);
                    flapY = flapVal * base.flap;
                    flapX = Math.cos(t * flapSpeed - base.phase) * (base.flap * 0.15); 
                    flapZ = -flapVal * (base.flap * 0.2) * Math.sign(base.z); 
                }
                
                let lx = base.x + flapX;
                let ly = base.y + flapY;
                let lz = base.z + flapZ;

                // 3D Rotations
                let rx = lx;
                let ry = ly * Math.cos(bank) - lz * Math.sin(bank);
                let rz = ly * Math.sin(bank) + lz * Math.cos(bank);

                let px = rx * Math.cos(pitch) - ry * Math.sin(pitch);
                let py = rx * Math.sin(pitch) + ry * Math.cos(pitch);
                let pz = rz;

                let fx = px * Math.cos(yaw) - pz * Math.sin(yaw);
                let fy = py;
                let fz = px * Math.sin(yaw) + pz * Math.cos(yaw);

                let finalX = worldPos.x + fx;
                let finalY = worldPos.y + fy;
                let finalZ = worldPos.z + fz;

                const camZ = -1000;
                const focalLength = 1000; 
                
                let relativeZ = finalZ - camZ;
                this.scale = focalLength / relativeZ;
                
                this.projX = (canvas.width / 2) + (finalX - canvas.width / 2) * this.scale;
                this.projY = (canvas.height / 2) + (finalY - canvas.height / 2) * this.scale;
                this.projZ = finalZ;
            }
        }

        function init() {
            birdParticles = [];
            nodes.forEach((_, index) => {
                birdParticles.push(new NodeParticle(index));
            });
        }

        function drawEtherealBird() {
            // Additive blending creates the glowing light effect
            ctx.globalCompositeOperation = 'lighter'; 

            let sortedFaces = faces.map(faceNodes => {
                let pts = faceNodes.map(idx => birdParticles[idx]);
                let avgZ = pts.reduce((sum, p) => sum + p.projZ, 0) / pts.length;
                return { pts, avgZ };
            }).sort((a, b) => b.avgZ - a.avgZ); 

            // Draw Panels
            sortedFaces.forEach(face => {
                ctx.beginPath();
                ctx.moveTo(face.pts[0].projX, face.pts[0].projY);
                for(let i = 1; i < face.pts.length; i++) {
                    ctx.lineTo(face.pts[i].projX, face.pts[i].projY);
                }
                ctx.closePath();
                
                // Extremely subtle fill to just hint at the surface
                let zFactor = Math.max(0.01, 0.05 + (face.pts[0].scale * 0.05)); 
                ctx.fillStyle = `rgba(130, 190, 255, ${zFactor})`;
                ctx.fill();
                
                // Thinner, softer structural lines
                ctx.lineWidth = 0.5;
                ctx.strokeStyle = `rgba(180, 220, 255, ${zFactor * 2})`;
                ctx.stroke();
            });

            // Draw Organic Particles
            let sortedNodes = [...birdParticles].sort((a, b) => b.projZ - a.projZ);
            sortedNodes.forEach(p => {
                // Use a sine wave to make the particle naturally pulse and twinkle
                let twinkle = Math.sin(globalTime * 10 * p.twinkleSpeed + p.twinklePhase) * 0.5 + 0.5;
                
                let alpha = Math.max(0.05, p.scale * 0.3 * twinkle); 
                ctx.fillStyle = `rgba(${p.color}, ${alpha})`;
                
                ctx.beginPath();
                // Add blur so they look like stardust
                ctx.shadowBlur = 6 * p.scale * twinkle;
                ctx.shadowColor = `rgba(${p.color}, ${alpha * 2})`;
                ctx.arc(p.projX, p.projY, p.size * p.scale, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Reset composite operation so it doesn't mess up the canvas clearing next frame
            ctx.shadowBlur = 0;
            ctx.globalCompositeOperation = 'source-over';
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            globalTime += 0.015;

            let currentPos = getFlightPath(globalTime);
            let nextPos = getFlightPath(globalTime + 0.05);
            let prevPos = getFlightPath(globalTime - 0.05);
            
            let dx = nextPos.x - currentPos.x;
            let dy = nextPos.y - currentPos.y;
            let dz = nextPos.z - currentPos.z;

            let yaw = Math.atan2(dz, dx);
            let pitch = Math.atan2(dy, Math.sqrt(dx*dx + dz*dz));
            
            let prevDx = currentPos.x - prevPos.x;
            let prevDz = currentPos.z - prevPos.z;
            let prevYaw = Math.atan2(prevDz, prevDx);
            let yawDelta = yaw - prevYaw;
            
            if (yawDelta > Math.PI) yawDelta -= Math.PI * 2;
            if (yawDelta < -Math.PI) yawDelta += Math.PI * 2;
            
            let bank = yawDelta * -15; 

            birdParticles.forEach(p => p.update(currentPos, yaw, pitch, bank, globalTime));
            
            drawEtherealBird();
            
            requestAnimationFrame(animate);
        }

        init();
        animate();
    });
</script>
</head>
<body>
</body>
</html>
