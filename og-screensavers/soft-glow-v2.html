<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enhanced Soft Glow</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: #080808;
        overflow: hidden;
    }
    .glow {
        position: fixed;
        width: 100vmax;
        height: 100vmax;
        pointer-events: none;
        animation: moveGlow 30s ease-in-out infinite;
    }
    @keyframes moveGlow {
        0% { 
            transform: translate(-50%, -50%) scale(1);

        }
