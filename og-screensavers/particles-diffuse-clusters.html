<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diffuse Clusters</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: #001524;
        overflow: hidden;
    }
    .particle {
        position: fixed;
        background: rgba(180, 200, 255, 0.2);
        border-radius: 50%;
        pointer-events: none;
        box-shadow: 0 0 2px rgba(180, 200, 255, 0.15);
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        function createCluster(centerX, centerY, numParticles, radius) {
            for (let i = 0; i < numParticles; i++) {
                const r = Math.pow(Math.random(), 0.5) * radius; // Square root for more even distribution
                const angle = Math.random() * Math.PI * 2;
                const x = centerX + Math.cos(angle) * r;
                const y = centerY + Math.sin(angle) * r;
                createParticle(x, y);
            }
        }

        function createBackgroundParticles(num) {
            for (let i = 0; i < num; i++) {
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                createParticle(x, y, true);
            }
        }

        function initClusters() {
            const numClusters = 4;
            createBackgroundParticles(50);
            
            for (let i = 0; i < numClusters; i++) {
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                createCluster(x, y, 30, 200);
            }
        }

        function createParticle(x, y, isBackground = false) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const size = isBackground ? Math.random() * 2 + 1 : Math.random() * 3 + 1.5;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.opacity = isBackground ? '0.15' : '0.25';
            
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            
            document.body.appendChild(particle);
            
            const duration = Math.random() * 40000 + 30000;
            const range = isBackground ? 100 : 200;
            const targetX = x + (Math.random() - 0.5) * range;
            const targetY = y + (Math.random() - 0.5) * range;
            
            const keyframes = [];
            const steps = 8;
            
            for (let i = 0; i <= steps; i++) {
                const progress = i / steps;
                const currentX = x + (targetX - x) * progress;
                const currentY = y + (targetY - y) * progress;
                const offset = Math.sin(progress * Math.PI * 2) * (isBackground ? 15 : 30);
                
                keyframes.push({
                    transform: `translate(${offset}px, ${currentY - y}px)`,
                    opacity: isBackground ? 0.15 : Math.random() * 0.3 + 0.2
                });
            }
            
            particle.animate(keyframes, {
                duration: duration,
                easing: 'ease-in-out'
            }).onfinish = () => {
                particle.remove();
                createParticle(targetX, targetY, isBackground);
            };
        }

        initClusters();
    });
</script>
</head>
<body>
</body>
</html>
