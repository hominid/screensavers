<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enhanced Connected Particles</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: #001524;
        overflow: hidden;
    }
    canvas {
        position: fixed;
        top: 0;
        left: 0;
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        document.body.appendChild(canvas);

        let particles = [];
        let clusters = [];
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        resize();
        window.addEventListener('resize', resize);

        class Particle {
            constructor(x, y, clusterId) {
                this.x = x;
                this.y = y;
                this.targetX = x;
                this.targetY = y;
                this.progress = 0;
                this.speed = 0.0001 + Math.random() * 0.0001;
                this.offset = Math.random() * Math.PI * 2;
                this.clusterId = clusterId;
                this.size = Math.random() * 2 + 1;
                this.setNewTarget();
            }

            setNewTarget() {
                const cluster = clusters[this.clusterId];
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.pow(Math.random(), 0.5) * cluster.radius; // More spread out distribution
                this.startX = this.x;
                this.startY = this.y;
                this.targetX = cluster.x + Math.cos(angle) * distance;
                this.targetY = cluster.y + Math.sin(angle) * distance;
                this.progress = 0;
            }

            update() {
                this.progress += this.speed;
                if (this.progress >= 1) {
                    this.setNewTarget();
                }
                
                const t = Math.sin(this.progress * Math.PI);
                this.x = this.startX + (this.targetX - this.startX) * t;
                this.y = this.startY + (this.targetY - this.startY) * t;
            }
        }

        function createCluster(x, y, numParticles, radius) {
            const clusterId = clusters.length;
            clusters.push({ x, y, radius });
            
            for (let i = 0; i < numParticles; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.pow(Math.random(), 0.5) * radius;
                const particleX = x + Math.cos(angle) * distance;
                const particleY = y + Math.sin(angle) * distance;
                particles.push(new Particle(particleX, particleY, clusterId));
            }
        }

        function init() {
            particles = [];
            clusters = [];
            
            // Create more varied clusters
            const numClusters = Math.floor(Math.random() * 8) + 8; // 8-15 clusters
            
            for (let i = 0; i < numClusters; i++) {
                const radius = Math.random() * 200 + 150; // 150-350px radius
                const particles = Math.floor(Math.random() * 49) + 7; // 7-55 particles
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                createCluster(x, y, particles, radius);
            }
        }

        function drawConnections() {
            clusters.forEach((cluster, clusterId) => {
                const clusterParticles = particles.filter(p => p.clusterId === clusterId);
                
                clusterParticles.forEach((p1, i) => {
                    clusterParticles.forEach((p2, j) => {
                        if (i < j) {
                            const dx = p1.x - p2.x;
                            const dy = p1.y - p2.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            
                            if (distance < 150) { // Increased connection distance
                                const alpha = (1 - distance / 150) * 0.15;
                                ctx.strokeStyle = `rgba(180, 200, 255, ${alpha})`;
                                ctx.beginPath();
                                ctx.moveTo(p1.x, p1.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.stroke();
                            }
                        }
                    });
                });
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawConnections();
            
            particles.forEach(particle => {
                particle.update();
                
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(180, 200, 255, 0.4)';
                ctx.fill();
            });
            
            requestAnimationFrame(animate);
        }

        init();
        animate();
    });
</script>
</head>
<body>
</body>
</html>
