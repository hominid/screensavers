<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Clusters</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: #001524;
        overflow: hidden;
    }
    .particle {
        position: fixed;
        background: rgba(180, 200, 255, 0.2);
        border-radius: 50%;
        pointer-events: none;
        box-shadow: 0 0 2px rgba(180, 200, 255, 0.15);
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        function createCluster(centerX, centerY, numParticles) {
            for (let i = 0; i < numParticles; i++) {
                const radius = Math.random() * 100;
                const angle = Math.random() * Math.PI * 2;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                createParticle(x, y);
            }
        }

        function initClusters() {
            const numClusters = 5;
            for (let i = 0; i < numClusters; i++) {
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                createCluster(x, y, 15);
            }
        }

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const size = Math.random() * 3 + 1;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            
            document.body.appendChild(particle);
            
            const duration = Math.random() * 40000 + 30000;
            const targetX = x + (Math.random() - 0.5) * 200;
            const targetY = y + (Math.random() - 0.5) * 200;
            
            const keyframes = [];
            const steps = 8;
            
            for (let i = 0; i <= steps; i++) {
                const progress = i / steps;
                const currentX = x + (targetX - x) * progress;
                const currentY = y + (targetY - y) * progress;
                const offset = Math.sin(progress * Math.PI * 2) * 30;
                
                keyframes.push({
                    transform: `translate(${offset}px, ${currentY - y}px)`,
                    opacity: Math.random() * 0.4 + 0.6
                });
            }
            
            particle.animate(keyframes, {
                duration: duration,
                easing: 'ease-in-out'
            }).onfinish = () => {
                particle.remove();
                createParticle(targetX, targetY);
            };
        }

        initClusters();
    });
</script>
</head>
<body>
</body>
</html>
